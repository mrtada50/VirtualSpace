name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept licenses and install NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;29.0.13846066" || true

      - name: Fetch BlackBox engine
        run: |
          git clone --depth 1 https://github.com/ALEX5402/NewBlackbox engine-src
          BC=$(find engine-src -maxdepth 1 -iname bcore | head -n1)
          echo "Engine module: $BC"
          rm -rf Bcore && cp -r "$BC" Bcore
          ls Bcore
          cat Bcore/build.gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: VirtualSpace-debug
          path: app/build/outputs/apk/debug/*.apk
