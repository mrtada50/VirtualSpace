name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Licenses and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;29.0.13846066" || echo ">>> NDK 29.0.13846066 not installable"
          echo "Installed NDKs:"; ls "$ANDROID_HOME/ndk"

      - name: Fetch BlackBox engine
        run: |
          rm -rf engine-src
          git clone --depth 1 https://github.com/ALEX5402/NewBlackbox engine-src
          for d in engine-src/*/; do
            n=$(basename "$d")
            if [ "$n" != "app" ] && { [ -f "$d/build.gradle" ] || [ -f "$d/build.gradle.kts" ]; }; then
              rm -rf "$n"; cp -r "$d" "$n"; echo "module: $n"
            fi
          done

      - name: Align NDK version
        run: |
          WANT=29.0.13846066
          if [ -d "$ANDROID_HOME/ndk/$WANT" ]; then V=$WANT; else V=$(ls "$ANDROID_HOME/ndk" | sort -V | tail -n1); fi
          echo "Using NDK $V"
          grep -rl "$WANT" . --include=*.gradle --include=*.kts --include=*.properties 2>/dev/null | xargs -r sed -i "s/$WANT/$V/g"
          grep -rn "ndkVersion" . --include=*.gradle --include=*.kts 2>/dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: VirtualSpace-debug
          path: app/build/outputs/apk/debug/*.apk
