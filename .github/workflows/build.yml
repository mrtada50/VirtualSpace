name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept licenses and install NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;29.0.13846066" || true

      - name: Fetch BlackBox engine
        run: |
          rm -rf engine-src
          git clone --depth 1 https://github.com/ALEX5402/NewBlackbox engine-src
          for d in engine-src/*/; do
            n=$(basename "$d")
            if [ "$n" != "app" ] && { [ -f "$d/build.gradle" ] || [ -f "$d/build.gradle.kts" ]; }; then
              rm -rf "$n"; cp -r "$d" "$n"; echo "module: $n"
            fi
          done
          echo "=== engine root build.gradle ==="
          cat engine-src/build.gradle 2>/dev/null || cat engine-src/build.gradle.kts 2>/dev/null || true
          echo "=== engine settings ==="
          cat engine-src/settings.gradle 2>/dev/null || cat engine-src/settings.gradle.kts 2>/dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: VirtualSpace-debug
          path: app/build/outputs/apk/debug/*.apk
